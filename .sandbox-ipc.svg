<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 292" width="900" height="292" font-family="system-ui, -apple-system, Segoe UI, sans-serif" color="currentColor"><defs><marker id="a11-currentColor" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="currentColor"/></marker><marker id="a2-currentColor" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="currentColor"/></marker></defs><text x="450.0" y="26" text-anchor="middle" font-size="18" font-weight="700">同一对进程，两种传输机制：差 21 倍</text><text x="450.0" y="46" text-anchor="middle" font-size="13" fill-opacity="0.65">Ryzen 9 5900HX / Windows，往返实测；同一份数据、同一对进程，只换机制</text><path d="M325.0,95.6 L575.0,95.6" stroke="currentColor" stroke-opacity="0.62" stroke-width="11.5" fill="none" stroke-linejoin="round" marker-end="url(#a11-currentColor)" marker-start="url(#a11-currentColor)"/><text x="390.5" y="87.9" font-size="13" fill="currentColor" fill-opacity="0.8">16.2 GB/s AF_UNIX</text><text x="390.5" y="103.9" font-size="11" fill="currentColor" fill-opacity="0.55">本机最快</text><path d="M325.0,140.4 L575.0,140.4" stroke="currentColor" stroke-opacity="0.62" stroke-width="2.2" fill="none" stroke-linejoin="round" marker-end="url(#a2-currentColor)" marker-start="url(#a2-currentColor)"/><text x="373.0" y="137.3" font-size="13" fill="currentColor" fill-opacity="0.8">0.76 GB/s TCP loopback</text><text x="373.0" y="153.3" font-size="11" fill="currentColor" fill-opacity="0.55">gloo 默认路径，本机不可用</text><rect x="175.0" y="62.0" width="150.0" height="112.0" rx="9" fill="none" stroke="currentColor" stroke-opacity="0.45"/><text x="250.0" y="89.0" text-anchor="middle" font-size="15" font-weight="600">进程 A（生产者）</text><text x="250.0" y="106.0" text-anchor="middle" font-size="13" fill="currentColor" fill-opacity="0.72"