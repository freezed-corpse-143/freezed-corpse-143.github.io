<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 308" width="900" height="308" font-family="system-ui, -apple-system, Segoe UI, sans-serif" color="#2b2b2b" role="img"><rect width="900" height="308" fill="#faf8f8"/><title>同一对进程，两种传输机制：差 21 倍</title><desc>Ryzen 9 5900HX / Windows，往返实测；同一份数据、同一对进程，只换机制</desc><text x="450.0" y="26" text-anchor="middle" font-size="18" font-weight="700">同一对进程，两种传输机制：差 21 倍</text><text x="450.0" y="46" text-anchor="middle" font-size="13" fill-opacity="0.7">Ryzen 9 5900HX / Windows，往返实测；同一份数据、同一对进程，只换机制</text><path d="M325.0,95.6 L575.0,95.6" stroke="#2b2b2b" stroke-opacity="0.8" stroke-width="11.5" fill="none"/><path d="M576.5,118.0 L557.8,128.3 L557.8,107.7 Z" fill="#2b2b2b"/><path d="M323.5,118.0 L342.2,107.7 L342.2,128.3 Z" fill="#2b2b2b"/><text x="390.5" y="80.9" font-size="13" fill="#2b2b2b" fill-opacity="0.9">16.2 GB/s AF_UNIX</text><text x="424.0" y="66.9" font-size="11" fill="#2b2b2b" fill-opacity="0.55">本机最快</text><path d="M325.0,140.4 L575.0,140.4" stroke="#2b2b2b" stroke-opacity="0.8" stroke-width="2.2" fill="none"/><path d="M576.5,118.0 L563.0,124.0 L563.0,112.0 Z" fill="#2b2b2b"/><path d="M323.5,118.0 L337.0,112.0 L337.0,124.0 Z" fill="#2b2b2b"/><text x="373.0" y="163.5" font-size="13" fill="#2b2b2b" fill-opacity="0.9">0.76 GB/s TCP loopback</text><text x="367.5" y="177.5" font-size="11" fill="#2b2b2b" fill-opacity="0.55">gloo 默认路径，本机不可用</text><rect x="175.0" y="62.0" width="150.0" height="112.0" rx="9" fill="none" stroke="#2b2b2b" stroke-opacity="0.45"/><text x="250.0" y="89.0" text-anchor="middle" font-size="15" font-weight="600">进程 A（生产者）</text><text x="250.0" y="106.0" text-anchor="middle" font-size="13" fill="#2b2b2b" fill-opacity="0.78">持有 GPU 上下文</text><text x="250.0" y="123.0" text-anchor="middle" font-size="13" fill="#2b2b2b" fill-opacity="0.78">1 MB 消息，8 线程</text><rect x="575.0" y="62.0" width="150.0" height="112.0" rx="9" fill="none" stroke="#2b2b2b" stroke-opacity="0.45"/><text x="650.0" y="89.0" text-anchor="middle" font-size="15" font-weight="600">进程 B（消费者）</text><text x="650.0" y="106.0" text-anchor="middle" font-size="13" fill="#2b2b2b" fill-opacity="0.78">无共享地址空间</text><text x="650.0" y="123.0" text-anchor="middle" font-size="13" fill="#2b2b2b" fill-opacity="0.78">校验收到的字节</text><text x="28" y="200.0" font-size="13" font-weight="600">粗细</text><text x="76" y="200.0" font-size="12" fill-opacity="0.7">3 + 7×log10(GB/s)，对数量表：读数用数字，粗细只给量级</text><text x="98.0" y="216.0" text-anchor="middle" font-size="12" fill-opacity="0.7">1</text><line x1="76.0" y1="226.0" x2="120.0" y2="226.0" stroke="#2b2b2b" stroke-width="3.0"/><text x="179.0" y="216.0" text-anchor="middle" font-size="12" fill-opacity="0.7">10</text><line x1="157.0" y1="226.0" x2="201.0" y2="226.0" stroke="#2b2b2b" stroke-width="10.0"/><text x="267.0" y="216.0" text-anchor="middle" font-size="12" fill-opacity="0.7">100</text><line x1="245.0" y1="226.0" x2="289.0" y2="226.0" stroke="#2b2b2b" stroke-width="17.0"/><text x="362.0" y="216.0" text-anchor="middle" font-size="12" fill-opacity="0.7">1000</text><line x1="340.0" y1="226.0" x2="384.0" y2="226.0" stroke="#2b2b2b" stroke-width="24.0"/><text x="464.0" y="216.0" text-anchor="middle" font-size="12" fill-opacity="0.7">4000</text><line x1="442.0" y1="226.0" x2="486.0" y2="226.0" stroke="#2b2b2b" stroke-width="28.2"/><text x="28" y="266.0" font-size="12" fill-opacity="0.7">证据</text><line x1="76" y1="262.0" x2="106" y2="262.0" stroke="#2b2b2b" stroke-width="3" stroke-dasharray=""/><text x="112" y="266.0" font-size="12" fill-opacity="0.7">实测</text><line x1="158.0" y1="262.0" x2="188.0" y2="262.0" stroke="#2b2b2b" stroke-width="3" stroke-dasharray="6 4"/><text x="194.0" y="266.0" font-size="12" fill-opacity="0.7">标称</text><line x1="240.0" y1="262.0" x2="270.0" y2="262.0" stroke="#2b2b2b" stroke-width="3" stroke-dasharray="2 3"/><text x="276.0" y="266.0" font-size="12" fill-opacity="0.7">推算</text><line x1="336.0" y1="262.0" x2="366.0" y2="262.0" stroke="#b45309" stroke-width="7"/><text x="372.0" y="266.0" font-size="12" fill-opacity="0.7">U ≥ 60%，本次负载的绑定项</text><text x="28" y="292.0" font-size="12" fill-opacity="0.7">箭头：单头 = 单工，双头 = 全双工，双向链路的粗细取较小的一侧；虚框 = 域外或共享资源，不计入本卡预算</text></svg>